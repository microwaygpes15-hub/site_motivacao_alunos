<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Painel Motivacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: grade de 30 mensagens na entrada; cada link #1 a #30 abre uma mensagem em tela cheia, pensada para o celular. */
:root {
  --bg: #FFF9F4;
  --fg: #2B2230;
  --muted: #6E6270;
  --line: #EADFD8;
  --accent: #D9467A;
  --font-hand: "Caveat", "Segoe Script", "Bradley Hand", cursive;
  --font-ui: "Nunito", "Trebuchet MS", system-ui, sans-serif;

  --m-bg: #FBE3E0;
  --m-fg: #2B2230;
  --m-soft: rgba(255,255,255,.55);

  --rose-bg: #FBE3E0;   --rose-fg: #2B2230;
  --blue-bg: #DCEBFA;   --blue-fg: #1F2B3A;
  --yellow-bg: #FFF1B8; --yellow-fg: #332B10;
  --lilac-bg: #E9E0F7;  --lilac-fg: #2A2340;
  --mint-bg: #D9F2E6;   --mint-fg: #17332A;
  --peach-bg: #FFE5CF;  --peach-fg: #38261A;
  --tile-soft: rgba(255,255,255,.6);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B161E; --fg: #F6EFEA; --muted: #B3A6B5; --line: #3A3040; --accent: #F58AB0;
    --rose-bg: #4A2A30;   --rose-fg: #FBE9E6;
    --blue-bg: #23364D;   --blue-fg: #E4F0FC;
    --yellow-bg: #4D4220; --yellow-fg: #FFF5CC;
    --lilac-bg: #38304F;  --lilac-fg: #EFE8FB;
    --mint-bg: #1F4237;   --mint-fg: #DFF6EA;
    --peach-bg: #4D3523;  --peach-fg: #FFEBD9;
    --tile-soft: rgba(255,255,255,.1);
    --m-soft: rgba(255,255,255,.1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B161E; --fg: #F6EFEA; --muted: #B3A6B5; --line: #3A3040; --accent: #F58AB0;
  --rose-bg: #4A2A30;   --rose-fg: #FBE9E6;
  --blue-bg: #23364D;   --blue-fg: #E4F0FC;
  --yellow-bg: #4D4220; --yellow-fg: #FFF5CC;
  --lilac-bg: #38304F;  --lilac-fg: #EFE8FB;
  --mint-bg: #1F4237;   --mint-fg: #DFF6EA;
  --peach-bg: #4D3523;  --peach-fg: #FFEBD9;
  --tile-soft: rgba(255,255,255,.1);
  --m-soft: rgba(255,255,255,.1);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 0;
  min-height: 100%;
}
button, a { font-family: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 10px; }

[data-tone="rose"]   { --t-bg: var(--rose-bg);   --t-fg: var(--rose-fg); }
[data-tone="blue"]   { --t-bg: var(--blue-bg);   --t-fg: var(--blue-fg); }
[data-tone="yellow"] { --t-bg: var(--yellow-bg); --t-fg: var(--yellow-fg); }
[data-tone="lilac"]  { --t-bg: var(--lilac-bg);  --t-fg: var(--lilac-fg); }
[data-tone="mint"]   { --t-bg: var(--mint-bg);   --t-fg: var(--mint-fg); }
[data-tone="peach"]  { --t-bg: var(--peach-bg);  --t-fg: var(--peach-fg); }

/* ---------- Entrada ---------- */
.home { max-width: 640px; margin-inline: auto; padding-block: 28px 40px; }
.home h1 {
  font-family: var(--font-hand);
  font-weight: 700;
  font-size: clamp(2.6rem, 12vw, 3.6rem);
  line-height: 1;
  margin: 0 0 8px;
  text-wrap: balance;
}
.home p.lead { margin: 0 0 24px; color: var(--muted); max-width: 34ch; }
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  list-style: none;
  margin: 0;
  padding: 0;
}
@media (min-width: 520px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile {
  display: flex;
  flex-direction: column;
  gap: 10px;
  height: 100%;
  min-height: 150px;
  padding: 14px;
  border-radius: 20px;
  background: var(--t-bg);
  color: var(--t-fg);
  text-decoration: none;
  transition: transform .15s ease;
}
.tile:active { transform: scale(.97); }
.tile-top { display: flex; align-items: center; justify-content: space-between; }
.tile-emoji {
  display: grid; place-items: center;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--tile-soft);
  font-size: 1.5rem;
}
.tile-n { font-weight: 800; font-size: .85rem; font-variant-numeric: tabular-nums; opacity: .75; }
.tile-text {
  font-family: var(--font-hand);
  font-weight: 700;
  font-size: 1.35rem;
  line-height: 1.1;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ---------- Mensagem ---------- */
.msg {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--t-bg);
  color: var(--t-fg);
  padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px calc(env(safe-area-inset-bottom, 0px) + 16px);
  overflow-y: auto;
}
.msg[hidden] { display: none; }
.msg-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  text-align: center;
  padding-block: 12px;
  min-width: 0;
}
.msg-emoji {
  display: grid; place-items: center;
  width: clamp(96px, 28vw, 128px);
  aspect-ratio: 1;
  max-width: 100%;
  border-radius: 50%;
  background: var(--m-soft);
  font-size: clamp(3.4rem, 15vw, 5rem);
  line-height: 1;
}
.msg-text {
  font-family: var(--font-hand);
  font-weight: 700;
  font-size: clamp(2.2rem, 10.5vw, 3.1rem);
  line-height: 1.12;
  margin: 0;
  max-width: 14em;
  text-wrap: balance;
  overflow-wrap: break-word;
}
.msg-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 12px;
}
.msg-nav a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding-inline: 16px;
  border-radius: 999px;
  background: var(--m-soft);
  color: var(--t-fg);
  text-decoration: none;
  font-weight: 800;
  font-size: .95rem;
}
.msg-count { font-weight: 700; font-size: .85rem; font-variant-numeric: tabular-nums; opacity: .75; }

@media (prefers-reduced-motion: no-preference) {
  .msg-body > * { animation: rise .45s ease both; }
  .msg-body > .msg-text { animation-delay: .08s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
}
</style>

</head>
<body>
<main class="home" id="home">
  <h1>Painel Motivacional</h1>
  <p class="lead">30 mensagens para você. Toque em uma para abrir.</p>
  <ul class="grid" id="grid"></ul>
</main>

<section class="msg" id="msg" hidden aria-live="polite">
  <div class="msg-body">
    <div class="msg-emoji" id="msg-emoji" aria-hidden="true"></div>
    <p class="msg-text" id="msg-text"></p>
  </div>
  <nav class="msg-nav" aria-label="Navegar entre mensagens">
    <a id="prev" href="#1">&larr; Anterior</a>
    <span class="msg-count" id="count"></span>
    <a id="next" href="#2">Próxima &rarr;</a>
  </nav>
</section>

<script>
(function () {
  var MSGS = [
    ["💬", "Você é mais forte do que imagina. Confie em sua capacidade de superar desafios."],
    ["🌱", "Errar faz parte de aprender. Cada tentativa te deixa mais perto do acerto."],
    ["🚀", "Pequenos passos todos os dias levam a grandes conquistas."],
    ["⭐", "Ninguém no mundo é igual a você, e isso é o seu maior talento."],
    ["💪", "Quando for difícil, lembre-se: você já superou dias difíceis antes."],
    ["🌈", "Depois da tempestade sempre vem o arco-íris. Continue caminhando!"],
    ["📚", "Aprender é o melhor presente que você pode dar a si mesmo."],
    ["🎯", "Seus sonhos são possíveis. Comece hoje, do seu jeito e no seu ritmo."],
    ["❤️", "Você é importante, é capaz e merece todas as coisas boas que estão por vir."],
    ["🔥", "Desistir não é opção quando o seu sonho é maior que o medo."],
    ["🦋", "Acredite em você: seu potencial é maior do que qualquer obstáculo."],
    ["🌟", "Sua opinião importa e a sua voz merece ser ouvida."],
    ["🧠", "Você não precisa saber tudo, só precisa ter coragem de tentar."],
    ["🌻", "Hoje é um ótimo dia para dar o seu melhor e se orgulhar disso."],
    ["🤝", "Juntos vamos mais longe. Ajude um colega e veja a sala brilhar."],
    ["🏆", "O esforço de hoje é a vitória de amanhã. Não pare!"],
    ["😊", "Seja gentil com você mesmo. Você está fazendo o seu melhor, e isso basta."],
    ["⚡", "Dentro de você existe uma força enorme. Descubra, use e brilhe!"],
    ["🌞", "Cada manhã é uma nova chance de recomeçar. Aproveite o seu dia!"],
    ["🎒", "Não importa a velocidade, o importante é nunca parar de aprender."],
    ["🧩", "Todo desafio é uma peça que ajuda você a se tornar mais forte."],
    ["🗝️", "A chave para o seu sucesso está na sua dedicação e na sua coragem."],
    ["🌳", "Grandes árvores começam pequenas. Tenha paciência com o seu crescimento."],
    ["🎈", "Sorria! Sua alegria ilumina a sala e o dia das pessoas ao seu redor."],
    ["🧭", "Você é quem escolhe o caminho. Siga com confiança e fé em você."],
    ["🙌", "Sua inteligência não tem limites. Continue curioso e faça perguntas!"],
    ["🌙", "Se hoje foi difícil, descanse. Amanhã você volta ainda mais forte."],
    ["💡", "Boas ideias nascem de quem tem coragem de pensar diferente. Seja você!"],
    ["🎉", "Comemore cada conquista, até as pequenas. Todas elas importam!"],
    ["💛", "Tenho muito orgulho de você. Continue acreditando e brilhando!"]
  ];
  var TONES = ["rose", "blue", "yellow", "lilac", "mint", "peach"];
  function tone(n) { return TONES[Math.floor((n - 1) / 5) % TONES.length]; }

  var grid = document.getElementById("grid");
  MSGS.forEach(function (m, i) {
    var n = i + 1;
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.className = "tile";
    a.href = "#" + n;
    a.setAttribute("data-tone", tone(n));
    a.setAttribute("aria-label", "Mensagem " + n + ": " + m[1]);
    a.innerHTML =
      '<div class="tile-top"><span class="tile-emoji" aria-hidden="true">' + m[0] +
      '</span><span class="tile-n">' + n + '</span></div>' +
      '<span class="tile-text"></span>';
    a.querySelector(".tile-text").textContent = m[1];
    li.appendChild(a);
    grid.appendChild(li);
  });

  var home = document.getElementById("home");
  var msg = document.getElementById("msg");

  function route() {
    var h = (location.hash || "").replace("#", "");
    var n = parseInt(h, 10);
    if (n >= 1 && n <= MSGS.length && String(n) === h) {
      var m = MSGS[n - 1];
      msg.setAttribute("data-tone", tone(n));
      document.getElementById("msg-emoji").textContent = m[0];
      document.getElementById("msg-text").textContent = m[1];
      document.getElementById("count").textContent = n + " de " + MSGS.length;
      document.getElementById("prev").setAttribute("href", "#" + (n === 1 ? MSGS.length : n - 1));
      document.getElementById("next").setAttribute("href", "#" + (n === MSGS.length ? 1 : n + 1));
      home.hidden = true;
      msg.hidden = false;
      msg.scrollTop = 0;
    } else {
      msg.hidden = true;
      home.hidden = false;
    }
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
